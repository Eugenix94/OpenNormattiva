name: Corte Costituzionale Auto Sync

on:
  schedule:
    - cron: '30 3 * * 1'   # Weekly Monday 03:30 UTC
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check for changes (no upload)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  HF_DATASET_REPO: diatribe00/italian-legal-lab-data

jobs:
  sync-corte:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests huggingface-hub lxml

      - name: Sync Corte datasets into HF dataset
        run: |
          if [[ "${{ github.event.inputs.check_only }}" == "true" ]]; then
            python sync_corte_costituzionale.py \
              --dataset-repo "${HF_DATASET_REPO}" \
              --check-only
            python sync_institutional_sparql.py \
              --dataset-repo "${HF_DATASET_REPO}" \
              --check-only
            python sync_institutional_rss.py \
              --dataset-repo "${HF_DATASET_REPO}" \
              --check-only
            python sync_senato_akomantoso_index.py \
              --dataset-repo "${HF_DATASET_REPO}" \
              --check-only
          else
            python sync_corte_costituzionale.py \
              --dataset-repo "${HF_DATASET_REPO}"

            python parse_corte_costituzionale.py \
              --dataset-repo "${HF_DATASET_REPO}" \
              --upload

            python sync_institutional_sparql.py \
              --dataset-repo "${HF_DATASET_REPO}"

            python sync_institutional_rss.py \
              --dataset-repo "${HF_DATASET_REPO}"

            python sync_senato_akomantoso_index.py \
              --dataset-repo "${HF_DATASET_REPO}"
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Upload sync report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corte-sync-report-${{ github.run_id }}
          path: |
            logs/corte_sync_report.json
            logs/institutional_sparql_sync_report.json
            logs/institutional_rss_sync_report.json
            logs/senato_akomantoso_sync_report.json
          retention-days: 30
